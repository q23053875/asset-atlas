services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: investment
      POSTGRES_USER: investment
      POSTGRES_PASSWORD: investment
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investment -d investment"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://investment:investment@db:5432/investment?schema=public
      CRON_SECRET: change-me
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }
volumes:
  postgres_data:
